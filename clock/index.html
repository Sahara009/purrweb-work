<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <title>Purrweb Clock</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="clock">
      <h2>Purrweb</h2>
      <div class="hour" id="hr"></div>
      <div class="min" id="mn"></div>
      <div class="sec" id="sc"></div>
      <div class="center-point"></div>
    </div>
    <button class="start" id="start">Старт</button>
    <button class="pause" id="pause">Пауза</button>

    <script src="script.js"></script>
  </body>
</html>
